<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 716" width="1120" height="716"
     font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <defs>
    <linearGradient id="fgTitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#123f86"/>
      <stop offset="100%" stop-color="#1f5fbf"/>
    </linearGradient>
    <marker id="fArrow" markerWidth="10" markerHeight="10" refX="8" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9aa8bc"/>
    </marker>
  </defs>

  <rect width="1120" height="716" fill="#f7f9fc"/>
  <rect x="0" y="0" width="1120" height="58" fill="url(#fgTitle)"/>
  <text x="28" y="37" fill="#ffffff" font-size="20" font-weight="700">
    一笔转账的完整链路 · 三道防线
  </text>
  <text x="1092" y="36" fill="#cfe0f8" font-size="12.5" text-anchor="end">
    任何模型输出都要过防线一；权限只由防线二裁定；资金只在防线三之后移动
  </text>

  <!-- 步骤 -->
  <g font-size="13.5" fill="#16202e">
    <rect x="36" y="80" width="700" height="68" rx="12" fill="#ffffff" stroke="#dfe5ee" stroke-width="2"/>
    <circle cx="72" cy="114" r="17" fill="#123f86"/>
    <text x="72" y="120" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="700">1</text>
    <text x="104" y="108" font-weight="700">语音输入</text>
    <text x="104" y="132" font-size="12.5" fill="#4a5a70">ASR：讯飞 IAT（粤语 accent / 普通话）　降级：浏览器原生识别　兜底：预置语料</text>

    <rect x="36" y="164" width="700" height="68" rx="12" fill="#ffffff" stroke="#dfe5ee" stroke-width="2"/>
    <circle cx="72" cy="198" r="17" fill="#123f86"/>
    <text x="72" y="204" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="700">2</text>
    <text x="104" y="192" font-weight="700">意图理解</text>
    <text x="104" y="216" font-size="12.5" fill="#4a5a70">通义千问 或 确定性规则解析器 → 结构化槽位（意图 / 金额 / 收款人）</text>

    <rect x="36" y="248" width="700" height="68" rx="12" fill="#eef4ff" stroke="#1f5fbf" stroke-width="2.5"/>
    <circle cx="72" cy="282" r="17" fill="#1f5fbf"/>
    <text x="72" y="288" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="700">3</text>
    <text x="104" y="276" font-weight="700">一致性校验（防线一）</text>
    <text x="104" y="300" font-size="12.5" fill="#4a5a70">金额与收款人必须能在用户原话里找到，对不上就回落到规则解析或直接中止</text>

    <rect x="36" y="332" width="700" height="68" rx="12" fill="#ffffff" stroke="#dfe5ee" stroke-width="2"/>
    <circle cx="72" cy="366" r="17" fill="#123f86"/>
    <text x="72" y="372" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="700">4</text>
    <text x="104" y="360" font-weight="700">计划生成</text>
    <text x="104" y="384" font-size="12.5" fill="#4a5a70">Plan-and-Execute 步骤编排　口语别名解析　重名歧义澄清　生成老人能听懂的复述文本</text>

    <rect x="36" y="416" width="700" height="68" rx="12" fill="#fff6f6" stroke="#c22b3c" stroke-width="2.5"/>
    <circle cx="72" cy="450" r="17" fill="#c22b3c"/>
    <text x="72" y="456" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="700">5</text>
    <text x="104" y="444" font-weight="700">注入净化 + 权限判定（防线二）</text>
    <text x="104" y="468" font-size="12.5" fill="#4a5a70">外部字段剔除指令型片段　反诈特征库比对　规则引擎裁定 L0 / L1 / L2 / L3</text>

    <rect x="36" y="500" width="700" height="68" rx="12" fill="#f2fbf7" stroke="#17845a" stroke-width="2.5"/>
    <circle cx="72" cy="534" r="17" fill="#17845a"/>
    <text x="72" y="540" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="700">6</text>
    <text x="104" y="528" font-weight="700">复述确认（防线三）</text>
    <text x="104" y="552" font-size="12.5" fill="#4a5a70">语音复述 + 大字弹窗二次确认（按钮延迟 1 秒激活）　L2 追加子女远程授权票据</text>

    <rect x="36" y="584" width="700" height="68" rx="12" fill="#ffffff" stroke="#dfe5ee" stroke-width="2"/>
    <circle cx="72" cy="618" r="17" fill="#123f86"/>
    <text x="72" y="624" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="700">7</text>
    <text x="104" y="612" font-weight="700">执行与留痕</text>
    <text x="104" y="636" font-size="12.5" fill="#4a5a70">模拟银行核心落账　每一阶段写入审计日志，事后可完整回放</text>
  </g>

  <!-- 步骤间箭头 -->
  <g stroke="#9aa8bc" stroke-width="2" marker-end="url(#fArrow)">
    <line x1="386" y1="148" x2="386" y2="160"/>
    <line x1="386" y1="232" x2="386" y2="244"/>
    <line x1="386" y1="316" x2="386" y2="328"/>
    <line x1="386" y1="400" x2="386" y2="412"/>
    <line x1="386" y1="484" x2="386" y2="496"/>
    <line x1="386" y1="568" x2="386" y2="580"/>
  </g>

  <!-- 右侧：三道防线标签 -->
  <g>
    <line x1="736" y1="282" x2="784" y2="282" stroke="#1f5fbf" stroke-width="2"/>
    <rect x="788" y="254" width="292" height="58" rx="10" fill="#eef4ff" stroke="#1f5fbf" stroke-width="2"/>
    <text x="806" y="278" font-size="13" fill="#123f86" font-weight="700">防线一 · 模型无资金权</text>
    <text x="806" y="299" font-size="11.5" fill="#4a5a70">LLM 只输出槽位，参数只认原话</text>

    <line x1="736" y1="450" x2="784" y2="450" stroke="#c22b3c" stroke-width="2"/>
    <rect x="788" y="418" width="292" height="64" rx="10" fill="#fff6f6" stroke="#c22b3c" stroke-width="2"/>
    <text x="806" y="442" font-size="13" fill="#c22b3c" font-weight="700">防线二 · 规则引擎独占裁定</text>
    <text x="806" y="460" font-size="11.5" fill="#4a5a70">额度 / 白名单 / 时段 / 收款人风险分</text>
    <text x="806" y="476" font-size="11.5" fill="#4a5a70">外部内容只作数据，永不作为指令</text>

    <line x1="736" y1="534" x2="784" y2="534" stroke="#17845a" stroke-width="2"/>
    <rect x="788" y="506" width="292" height="58" rx="10" fill="#f2fbf7" stroke="#17845a" stroke-width="2"/>
    <text x="806" y="530" font-size="13" fill="#17845a" font-weight="700">防线三 · 人在回路</text>
    <text x="806" y="551" font-size="11.5" fill="#4a5a70">复述 + 二次确认，不一致即中止</text>

    <rect x="788" y="164" width="292" height="76" rx="10" fill="#ffffff" stroke="#dfe5ee" stroke-width="2"/>
    <text x="806" y="188" font-size="13" fill="#16202e" font-weight="700">L0 / L1 / L2 / L3</text>
    <text x="806" y="208" font-size="11.5" fill="#4a5a70">L0 免密小额　L1 大字弹窗</text>
    <text x="806" y="226" font-size="11.5" fill="#4a5a70">L2 子女授权　L3 直接阻断</text>
  </g>
</svg>
